name: Deploy a Firebase Hosting

on:
  push:
    branches:
      - main   # Se ejecuta cada vez que haces push a la rama main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Desplegar a Firebase Hosting
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project asistencia-juventudes-cv
